name: diag4
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: find CFBase.h
        run: |
          set -x
          for sdk in /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk; do
            echo "== $sdk"
            f="$sdk/usr/include/CoreFoundation/CFBase.h"
            if [ -f "$f" ]; then
              grep -E "kCFCoreVersionNumber_iPhoneOS_1[0-9]_0|kCFCoreVersionNumber_iOS_1[0-9]_0" "$f" || echo "  (no iPhoneOS constants)"
            fi
          done
