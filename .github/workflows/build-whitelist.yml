name: build-wl


on:
  workflow_dispatch:

env:
  UPSTREAM_REF: "3.0.11"
  UPSTREAM_REPO: "opa334/Dopamine"

jobs:
  build:
    runs-on: macos-latest

    env:
      UPSTREAM: ${{ github.workspace }}/upstream
      THEOS: ${{ github.workspace }}/upstream/theos

    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout upstream at tag 3.0.11
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          path: upstream
          fetch-depth: 1

      - name: Verify source is exactly 3.0.11
        working-directory: ${{ env.UPSTREAM }}
        run: |
          set -e
          EXPECTED=448ff1a83d2bb807346f1f3d36332e4afbf9794a
          ACTUAL=$(git rev-parse HEAD)
          echo "HEAD=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: 源码不是 3.0.11（期望 $EXPECTED）"
            exit 1
          fi
          if ! grep -q "MARKETING_VERSION = 3.0.11;" Application/Dopamine.xcodeproj/project.pbxproj; then
            echo "FAIL: MARKETING_VERSION 不是 3.0.11"
            exit 1
          fi
          echo "OK: 正在构建 3.0.11 ($ACTUAL)"

      - name: Apply patch 1
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/no-update.patch
          cd "$UPSTREAM"
          git apply -v /tmp/no-update.patch
          echo "--- patched OK ---"
          grep -n "NO-UPDATE PATCH" Application/Dopamine/UI/DOUIManager.m Application/Dopamine/UI/DOMainViewController.m

      - name: Apply patch 2
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/no-bootlogo.patch
          cd "$UPSTREAM"
          git apply -v /tmp/no-bootlogo.patch
          echo "--- patched OK ---"
          grep -n "NO-BOOTLOGO PATCH" Application/Dopamine/Jailbreak/DOEnvironmentManager.m Application/Dopamine/UI/Settings/DOSettingsController.m
          if grep -q "jp2DataWithCompressionQuality" Application/Dopamine/Jailbreak/DOEnvironmentManager.m; then
            echo "FAIL: bootlogo 写入逻辑仍然存在"
            exit 1
          fi
          echo "OK: boot logo 功能已移除"

      - name: Apply patch 3
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/device-opt.patch
          cd "$UPSTREAM"
          git apply -v /tmp/device-opt.patch
          echo "--- patched OK ---"
          if grep -q "com.opa334" Application/Dopamine.xcodeproj/project.pbxproj; then
            echo "FAIL: pbxproj 中仍存在 com.opa334"
            exit 1
          fi
          grep -n "com.Sarielx.Dopamine" Application/Dopamine.xcodeproj/project.pbxproj | head -3
          ls BaseBin/_external/basebin/LaunchDaemons/
          echo "OK: bundle ID 已改为 com.Sarielx.Dopamine, 无关 exploit 已移除"

      - name: Apply patch 4
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/w2599-wl.patch
          cd "$UPSTREAM"
          git apply -v /tmp/w2599-wl.patch
          echo "--- patched OK ---"
          test -f BaseBin/systemhook/src/common/_zqbb.c || { echo "FAIL: _zqbb.c missing"; exit 1; }
          grep -q "zqbb_wantInject" BaseBin/systemhook/src/common/common.c || { echo "FAIL: common.c not gated"; exit 1; }
          test -f Application/Dopamine/Jailbreak/DORuntimeConfiguration.m || { echo "FAIL: runtime config missing"; exit 1; }
          grep -q "DORuntimeConfiguration.m in Sources" Application/Dopamine.xcodeproj/project.pbxproj || { echo "FAIL: pbxproj not wired"; exit 1; }
          echo "OK: 白名单注入与挂载钩子已接入"

      - name: Install Procursus (ldid, findutils, sed, coreutils, make)
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Install THEOS
        working-directory: ${{ env.UPSTREAM }}
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar

      - name: Build and install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: brew install libarchive

      - name: Download bootstraps
        working-directory: ${{ env.UPSTREAM }}/Application/Dopamine/Resources
        run: ./download_bootstraps.sh

      - name: Build Dopamine
        working-directory: ${{ env.UPSTREAM }}
        run: |
          set -x
          gmake -j$(sysctl -n hw.logicalcpu)

      - name: Verify build
        working-directory: ${{ env.UPSTREAM }}
        run: |
          set -e
          BIN=Application/build/Build/Products/Debug-iphoneos/Dopamine.app/Dopamine
          test -f "$BIN" || { echo "binary not found"; exit 1; }
          if strings "$BIN" | grep -q "api.github.com/repos/opa334/Dopamine"; then
            echo "FAIL: update endpoint still present in binary"
            exit 1
          fi
          echo "OK: update endpoint removed from binary"
          APP=Application/build/Build/Products/Debug-iphoneos/Dopamine.app
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "CFBundleShortVersionString=$VER"
          if [ "$VER" != "3.0.11" ]; then
            echo "FAIL: 产物版本是 $VER，不是 3.0.11"
            exit 1
          fi
          echo "OK: 产物确认为 3.0.11"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "CFBundleIdentifier=$BID"
          if [ "$BID" != "com.Sarielx.Dopamine" ]; then
            echo "FAIL: bundle ID 是 $BID，不是 com.Sarielx.Dopamine"
            exit 1
          fi
          echo "OK: bundle ID 为 com.Sarielx.Dopamine"
          if ls "$APP/Frameworks" | grep -q -E "Titan|weightBufs"; then
            echo "FAIL: Frameworks 中仍存在 Titan/weightBufs"
            exit 1
          fi
          echo "OK: 无关 exploit framework 已移除（剩余 $(ls "$APP/Frameworks" | wc -l | tr -d ' ') 个）"

      - name: Collect .tipa
        working-directory: ${{ env.UPSTREAM }}
        run: |
          set -e
          ls -la Application/
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp Application/Dopamine.tipa "$GITHUB_WORKSPACE/out/Dopamine-Sarielx-WhiteList.tipa"
          cd "$GITHUB_WORKSPACE/out"
          shasum -a 256 Dopamine-Sarielx-WhiteList.tipa | tee sha256.txt
          unzip -l Dopamine-Sarielx-WhiteList.tipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Sarielx-WhiteList
          path: |
            ${{ github.workspace }}/out/Dopamine-Sarielx-WhiteList.tipa
            ${{ github.workspace }}/out/sha256.txt
          if-no-files-found: error
